[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "factorio-learning-environment"
version = "0.4.3"
description = "Factorio Learning Environment"
authors = [
    {name = "Jack Hopkins", email = "noreply@github.com"},
    {name = "Mart Bakler", email = "noreply@github.com"},
    {name = "Neel Kant", email = "contact@neelkant.io"},
    {name = "Kian Kyars", email = "kiankyars@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "python-dotenv>=1.0.1",
    "pydantic>=2.10.6",
    "lupa>=2.4",
    "slpp>=1.2.3",
    "factorio-rcon-py==1.2.1",
    "construct>=2.10.70",
    "pillow>=11.1.0",
    "tomli",
    "numpy>=2.2.3",
    "gymnasium>=1.0.0",
    "tenacity>=9.0.0",
    "aiohttp>=3.8.0",
    "docker>=7.1.0",
    "matplotlib>=3.10.7",
    "platformdirs>=4.0.0",
    "pyyaml>=6.0.0",
    "stable-baselines3>=2.9.0",
    "sb3-contrib>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "rich>=14.0.0",
    "pytest-xdist>=3.8.0",
]
cluster = [
    "docker>=6.0.0",
    "pillow>=10.0.0",
    "psutil>=5.9.0",
]
rl = [
    "stable-baselines3>=2.0.0",
    "gymnasium>=1.0.0",
]
all = [
    "docker>=6.0.0",
    "stable-baselines3>=2.0.0",
]

[project.scripts]
fle = "fle.run:main"

[tool.hatch.version]
path = "fle/__init__.py"

[tool.hatch.build]
exclude = [
    "fle/**/__pycache__",
    "fle/**/*.pyc",
    "fle/**/*.pyo",
    "fle/**/*.pyd",
]

[tool.hatch.build.targets.wheel]
packages = ["fle"]

[tool.pytest.ini_options]
pythonpath = "fle/env"
testpaths = "tests"
python_files = "test_*.py"
markers = [
    "integration: marks tests as requiring a live Factorio server (deselect with -m 'not integration')",
]

[project.urls]
homepage = "https://jackhopkins.github.io/factorio-learning-environment/"
leaderboard = "https://jackhopkins.github.io/factorio-learning-environment/leaderboard/"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
publish-url = "https://upload.pypi.org/legacy/"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/legacy/"
publish-url = "https://test.pypi.org/legacy/"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.2.0",
    "pytest-xdist>=3.8.0",
]
